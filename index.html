<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถอดเสียงเป็นข้อความ | Speech to Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">🎙️</div>
    <h1>ถอดเสียงเป็นข้อความ</h1>
    <p class="subtitle">อัปโหลดไฟล์เสียง แล้วรับข้อความแบบครบทุกคำ ไม่ตัดคำ</p>
  </header>

  <main class="container">
    <section class="card">
      <div id="dropZone" class="drop-zone">
        <input type="file" id="fileInput" accept="audio/*" hidden>
        <div class="drop-content">
          <div class="upload-icon">📁</div>
          <p class="drop-text">ลากไฟล์เสียงมาวาง หรือ</p>
          <button id="browseBtn" class="btn btn-primary">เลือกไฟล์เสียง</button>
          <p class="hint">รองรับ MP3, WAV, M4A, OGG ฯลฯ</p>
        </div>
      </div>
      <div id="fileInfo" class="file-info hidden">
        <span id="fileName"></span>
        <button id="changeFileBtn" class="btn-text">เปลี่ยนไฟล์</button>
      </div>
    </section>

    <section class="card settings">
      <div class="setting-item">
        <label for="langSelect">ภาษา</label>
        <select id="langSelect">
          <option value="th">ไทย</option>
          <option value="en">อังกฤษ</option>
          <option value="auto">ตรวจจับอัตโนมัติ</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="modelSelect">ความแม่นยำ</label>
        <select id="modelSelect">
          <option value="Xenova/whisper-tiny">เร็ว (ไฟล์เล็ก)</option>
          <option value="Xenova/whisper-base" selected>สมดุล (แนะนำ)</option>
          <option value="Xenova/whisper-small">แม่นยำสูง (ไฟล์ใหญ่กว่า)</option>
        </select>
      </div>
      <button id="startBtn" class="btn btn-success" disabled>เริ่มถอดเสียง</button>
    </section>

    <section id="progressCard" class="card hidden">
      <div class="progress-bar-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <p id="statusText" class="status-text">กำลังเตรียมโมเดล...</p>
    </section>

    <section id="resultCard" class="card hidden">
      <div class="result-header">
        <h2>ผลลัพธ์การถอดเสียง</h2>
        <span id="wordCount" class="word-count"></span>
      </div>
      <textarea id="resultText" class="result-text" readonly placeholder="ข้อความที่ถอดได้จะแสดงที่นี่..."></textarea>
      <div class="result-actions">
        <button id="copyBtn" class="btn btn-secondary">📋 คัดลอก</button>
        <button id="downloadBtn" class="btn btn-secondary">⬇️ ดาวน์โหลด .txt</button>
        <button id="clearBtn" class="btn btn-text">ล้างข้อมูล</button>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>ประมวลผลทั้งหมดในเบราว์เซอร์ของคุณ — ไฟล์เสียงไม่ถูกส่งขึ้นเซิร์ฟเวอร์ใดๆ 🔒</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
